services:
  db:
    image: postgres:16
    container_name: smartstay_db
    restart: always
    environment:
      POSTGRES_USER: smartstay_user
      POSTGRES_PASSWORD: smartstay_pass
      POSTGRES_DB: smartstay_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: smartstay_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartstay.com
      PGADMIN_DEFAULT_PASSWORD: admin_pass
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: